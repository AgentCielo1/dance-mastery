name: Deploy to GitHub Pages

# Ships app/ as the live site (a PWA: installable on a phone home screen,
# offline-capable via sw.js). The MediaPipe runtime + pose model are vendored
# at deploy time (they're gitignored), so the Practice Mirror's live camera
# works on the published site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (never deploy a broken session engine)
        run: cd app && npm test

      - name: Vendor the pose runtime (MediaPipe tasks-vision + model)
        run: cd app && node scripts/fetch-models.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
